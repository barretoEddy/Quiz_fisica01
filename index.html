
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1724;
    --card:#0b1320cc;
    --glass:linear-gradient(135deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
    --accent:#185FA5;
    --accent-2:#7dd3fc;
    --success:#3B6D11;
    --danger:#A32D2D;
    --muted: #9aa6b2;
    --radius:12px;
  }
  html,body{height:100%;margin:0;font-family:'DM Sans',system-ui,Arial;background:radial-gradient(1200px 400px at 10% 10%, rgba(29,78,216,0.06), transparent), linear-gradient(180deg,#071126 0%, #071826 100%);color:#e6eef8}
  body{display:flex;align-items:center;justify-content:center;padding:28px}
  .quiz-wrap{width:min(100%,820px);margin:0 auto;padding:28px;background:var(--card);backdrop-filter: blur(6px);border-radius:16px;box-shadow:0 8px 30px rgba(2,6,23,0.6);}
  h2{font-family:'Playfair Display',serif;text-align:center;color:var(--accent);margin:0 0 18px 0}
  .progress-bar-bg{background:rgba(255,255,255,0.03);border-radius:999px;height:10px;margin-bottom:16px;overflow:hidden}
  .progress-bar-fill{background:linear-gradient(90deg,var(--accent),var(--accent-2));height:10px;width:0;transition:width 520ms cubic-bezier(.2,.9,.2,1)}
  .progress-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .tag{display:inline-block;font-size:12px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,0.03);color:var(--accent);font-weight:600}
  .counter{font-size:13px;color:var(--muted)}
  .question-text{font-size:clamp(18px,2.3vw,20px);font-weight:600;color:#e9f3ff;line-height:1.5;margin:14px 0;overflow-wrap:anywhere}
  .options{display:grid;grid-template-columns:1fr;gap:10px;margin-top:6px}
  .option-btn{width:100%;min-height:54px;text-align:left;background:transparent;border:1px solid rgba(255,255,255,0.04);border-radius:12px;padding:14px 16px;font-size:15px;color:#eaf6ff;cursor:pointer;display:flex;align-items:center;gap:12px;transition:transform 180ms,box-shadow 180ms,border-color 150ms;touch-action:manipulation}
  .option-btn:hover:not(:disabled){transform:translateY(-4px);box-shadow:0 6px 18px rgba(2,6,23,0.6);border-color:rgba(255,255,255,0.08)}
  .option-btn:disabled{opacity:0.9;cursor:default}
  .option-label{width:34px;height:34px;flex:0 0 34px;border-radius:8px;background:rgba(255,255,255,0.03);display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:var(--accent)}
  .option-btn.correct{background:linear-gradient(90deg, rgba(86,159,48,0.12), rgba(85,166,107,0.06));border-color:rgba(98,160,60,0.4);color:var(--success)}
  .option-btn.wrong{background:linear-gradient(90deg, rgba(163,45,45,0.06), rgba(163,45,45,0.03));border-color:rgba(163,45,45,0.2);color:var(--danger)}
  .feedback-box{border-radius:10px;padding:12px 14px;margin:12px 0;font-size:15px;line-height:1.5;overflow-wrap:anywhere}
  .feedback-box.correct{background:rgba(98,160,60,0.06);border:1px solid rgba(98,160,60,0.12);color:var(--success)}
  .feedback-box.wrong{background:rgba(163,45,45,0.04);border:1px solid rgba(163,45,45,0.08);color:var(--danger)}
  .nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:12px}
  .btn-next{background:linear-gradient(90deg,var(--accent),#0c63a3);color:#fff;border:none;padding:12px 16px;border-radius:10px;cursor:pointer;font-weight:600;min-height:44px}
  .btn-next[disabled]{opacity:0.6;cursor:default}
  .score-screen{text-align:center;padding:18px 8px}
  .score-big{font-size:clamp(42px,8vw,56px);font-weight:700;color:var(--accent);margin-bottom:6px;line-height:1}
  .score-label{font-size:15px;color:var(--muted);margin-bottom:18px;overflow-wrap:anywhere}
  .topic-results{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:12px 0}
  .topic-card{background:rgba(255,255,255,0.02);border-radius:10px;padding:12px;text-align:left;min-width:0}
  .topic-card-name{font-size:13px;color:var(--muted)}
  .topic-card-score{font-size:18px;font-weight:700;color:#eaf6ff}
  .btn-restart{background:transparent;border:1px solid rgba(255,255,255,0.06);color:#fff;padding:12px 16px;border-radius:10px;cursor:pointer;min-height:44px}
  .review-list{display:grid;gap:10px}
  .review-item{padding:10px;border-radius:8px;background:rgba(255,255,255,0.01);border:1px solid rgba(255,255,255,0.02);text-align:left}
  .review-question{font-weight:600;line-height:1.45;overflow-wrap:anywhere}
  .review-meta{margin-top:6px;color:var(--muted);line-height:1.45;overflow-wrap:anywhere}
  .score-actions{margin-top:12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  @media (max-width:1024px){
    body{padding:20px}
    .quiz-wrap{padding:24px}
  }
  @media (max-width:768px){
    body{padding:14px;align-items:flex-start}
    .quiz-wrap{padding:18px;border-radius:14px}
    .progress-row{gap:10px;align-items:flex-start;flex-wrap:wrap}
    .nav-row{flex-direction:column;align-items:stretch}
    .btn-next,.btn-restart{width:100%}
    .topic-results{grid-template-columns:1fr 1fr}
    .score-actions{grid-template-columns:1fr}
  }
  @media (max-width:520px){
    body{padding:10px}
    .quiz-wrap{padding:16px;border-radius:12px}
    .progress-bar-bg{height:8px;margin-bottom:14px}
    .progress-bar-fill{height:8px}
    .tag,.counter{font-size:12px}
    .option-btn{padding:12px 14px;gap:10px}
    .option-label{width:30px;height:30px;flex-basis:30px}
    .question-text{font-size:17px}
    .topic-results{grid-template-columns:1fr}
    .score-screen{padding:10px 2px}
  }
</style>

<div class="quiz-wrap">
  <h2 class="sr-only">Quiz de Física — Cinemática ENEM</h2>
  <div id="quiz-area" aria-live="polite"></div>
</div>

<script>
const ALL_QUESTIONS = [
  {
    topic: "Velocidade Média",
    text: "Um carro percorre 120 km em 1,5 h e depois mais 60 km em 0,5 h. Qual é a velocidade média em todo o percurso?",
    options: ["80 km/h", "90 km/h", "100 km/h", "110 km/h"],
    correct: 1,
    explanation: "Velocidade média = distância total / tempo total. Distância = 120 + 60 = 180 km. Tempo = 1,5 + 0,5 = 2 h. Vm = 180/2 = 90 km/h."
  },
  {
    topic: "MRU",
    text: "Dois trens partem em sentidos opostos a partir do mesmo ponto. Um vai a 60 km/h e o outro a 80 km/h. Em quanto tempo estarão separados por 420 km?",
    options: ["2 h", "2,5 h", "3 h", "3,5 h"],
    correct: 2,
    explanation: "No MRU em sentidos opostos, as velocidades se somam: 60 + 80 = 140 km/h. Tempo = 420 / 140 = 3 h."
  },
  {
    topic: "MRUV",
    text: "Um carro parte do repouso e acelera uniformemente a 4 m/s². Qual é a velocidade após percorrer 50 m?",
    options: ["10 m/s", "15 m/s", "20 m/s", "25 m/s"],
    correct: 3,
    explanation: "Use v² = v₀² + 2aΔs → v² = 0 + 2·4·50 = 400 → v = 20 m/s."
  },
  {
    topic: "Queda Livre",
    text: "Um objeto é largado do repouso de uma altura de 80 m. Adotando g = 10 m/s², qual é a velocidade ao atingir o solo?",
    options: ["20 m/s", "30 m/s", "40 m/s", "50 m/s"],
    correct: 2,
    explanation: "v² = 2gh = 2·10·80 = 1600 → v = 40 m/s. Tempo de queda: t = v/g = 40/10 = 4 s."
  },
  {
    topic: "Lançamento Vertical",
    text: "Uma bola é lançada verticalmente para cima com v₀ = 30 m/s (g = 10 m/s²). Qual é a altura máxima atingida?",
    options: ["30 m", "45 m", "60 m", "90 m"],
    correct: 1,
    explanation: "No ponto mais alto, v = 0. v² = v₀² – 2gH → 0 = 900 – 2·10·H → H = 900/20 = 45 m."
  },
  {
    topic: "MRUV",
    text: "(ENEM-estilo) Um veículo freia de 20 m/s até parar com desaceleração de 5 m/s². Qual é o espaço percorrido durante a frenagem?",
    options: ["20 m", "30 m", "40 m", "50 m"],
    correct: 2,
    explanation: "v² = v₀² – 2a·Δs → 0 = 400 – 2·5·Δs → Δs = 400/10 = 40 m."
  },
  {
    topic: "Velocidade Média",
    text: "Um atleta percorre a primeira metade de uma pista a 4 m/s e a segunda metade a 6 m/s. Qual é a velocidade média?",
    options: ["4,8 m/s", "5,0 m/s", "5,2 m/s", "5,5 m/s"],
    correct: 0,
    explanation: "Para distâncias iguais: Vm = 2·v₁·v₂ / (v₁+v₂) = 2·4·6 / 10 = 48/10 = 4,8 m/s. Atenção: não é simplesmente a média aritmética!"
  },
  {
    topic: "Queda Livre",
    text: "Dois objetos são soltos do repouso, um do dobro da altura do outro. A razão entre os tempos de queda (maior/menor) é:",
    options: ["√2", "2", "√3", "4"],
    correct: 0,
    explanation: "h = ½gt² → t = √(2h/g). Se h₂ = 2h₁, então t₂/t₁ = √(2h₂/g) / √(2h₁/g) = √(h₂/h₁) = √2."
  }
];

// 0 = usar todas as questões disponíveis
const QUESTIONS_PER_ROUND = 0;

function pickRoundQuestions(sourceQuestions, count){
  const pool = shuffleArray(sourceQuestions);
  if (!count || count <= 0) return pool;
  const targetCount = Math.min(count, pool.length);
  return pool.slice(0, targetCount);
}

// perguntas ativas para a rodada
let questions = pickRoundQuestions(ALL_QUESTIONS, QUESTIONS_PER_ROUND);

let current = 0;
let score = 0;
let answered = false;
let userAnswers = [];
const topicScores = {};
let shuffledOptions = null;

function shuffleArray(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]
  }
  return a;
}

function renderQuestion() {
  const q = questions[current];
  const total = questions.length;
  const pct = Math.round(current / total * 100);
  const labels = ['A','B','C','D'];
  // prepare shuffled options with original indices
  const opts = q.options.map((t,i)=>({text:t,orig:i}));
  shuffledOptions = shuffleArray(opts);
  const optsHtml = shuffledOptions.map((optObj,i)=>`
    <button class="option-btn" id="opt-${i}" data-orig="${optObj.orig}" onclick="selectAnswer(${i})" role="button" tabindex="0">
      <span class="option-label">${labels[i] || (i+1)}</span>
      <div style="flex:1">${optObj.text}</div>
    </button>
  `).join('');

  document.getElementById('quiz-area').innerHTML = `
    <div class="progress-row">
      <div class="tag">${q.topic}</div>
      <div class="counter">Questão ${current+1} de ${total}</div>
    </div>
    <div class="progress-bar-bg"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
    <p class="question-text">${q.text}</p>
    <div class="options">${optsHtml}</div>
    <div id="feedback" aria-live="polite"></div>
    <div class="nav-row">
      <span></span>
      <button class="btn-next" id="btn-next" style="display:none" onclick="nextQuestion()">
        ${current < total-1 ? 'Próxima →' : 'Ver resultado →'}
      </button>
    </div>
  `;
  answered = false;
}

function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const labels = ['A','B','C','D','E','F'];
  const chosenBtn = document.getElementById('opt-'+idx);
  // original index of chosen option
  const chosenOrig = parseInt(chosenBtn.getAttribute('data-orig'),10);
  const isCorrect = chosenOrig === q.correct;
  if (isCorrect) score++;
  userAnswers.push({ correct: isCorrect, topic: q.topic, chosen: chosenOrig, chosenText: shuffledOptions[idx].text, correctText: q.options[q.correct] });

  // disable and mark
  const btns = document.querySelectorAll('[id^="opt-"]');
  btns.forEach((btn,i)=>{
    btn.disabled = true;
    const orig = parseInt(btn.getAttribute('data-orig'),10);
    if (orig === q.correct) btn.classList.add('correct');
    if (i === idx && orig !== q.correct) btn.classList.add('wrong');
  });

  const fb = document.getElementById('feedback');
  fb.innerHTML = `<div class="feedback-box ${isCorrect ? 'correct' : 'wrong'}">
    ${isCorrect ? '✓ Correto! ' : '✗ Incorreto. '} ${q.explanation}
  </div>`;
  document.getElementById('btn-next').style.display = 'inline-block';
}

function nextQuestion() {
  current++;
  if (current < questions.length) {
    renderQuestion();
  } else {
    renderScore();
  }
}

function renderScore() {
  const total = questions.length;
  const pct = Math.round(score / total * 100);
  const topicMap = {};
  userAnswers.forEach(a => {
    if (!topicMap[a.topic]) topicMap[a.topic] = {correct:0,total:0};
    topicMap[a.topic].total++;
    if (a.correct) topicMap[a.topic].correct++;
  });

  const topicCards = Object.entries(topicMap).map(([name, v]) => `
    <div class="topic-card">
      <div class="topic-card-name">${name}</div>
      <div class="topic-card-score">${v.correct}/${v.total}</div>
    </div>
  `).join('');

  let msg = pct >= 75 ? '🎯 Ótimo desempenho!' : pct >= 50 ? '📚 Bom começo, continue praticando!' : '💪 Revise os tópicos e tente novamente!';
  // build review list
  const reviewItems = questions.map((q,i)=>{
    const ua = userAnswers[i];
    const chosen = ua ? ua.chosenText : '—';
    const correct = q.options[q.correct];
    const cls = ua ? (ua.correct? 'correct':'wrong') : '';
    return `<div style="margin-bottom:10px;padding:10px;border-radius:8px;background:rgba(255,255,255,0.01);border:1px solid rgba(255,255,255,0.02)">
      <div style="font-weight:600">${i+1}. ${q.text}</div>
      <div style="margin-top:6px;color:var(--muted)"><strong>Sua resposta:</strong> ${chosen} — <strong>Correta:</strong> ${correct}</div>
    </div>`;
  }).join('');

  document.getElementById('quiz-area').innerHTML = `
    <div class="score-screen">
      <div class="score-big">${score}/${total}</div>
      <div class="score-label">${pct}% de acerto — ${msg}</div>
      <div class="topic-results">${topicCards}</div>
      <div class="review-list" style="margin-top:12px">${reviewItems}</div>
      <div class="score-actions">
        <button class="btn-restart" onclick="restart()">Reiniciar quiz</button>
        <button class="btn-next" onclick="sendPrompt('Quero praticar mais questões de física para o ENEM, especialmente sobre MRUV e queda livre')">Quero mais questões ↗</button>
      </div>
    </div>
  `;
}

function restart() {
  current = 0; score = 0; userAnswers = [];
  renderQuestion();
}

// keyboard support: 1-4 and A-D
document.addEventListener('keydown', (e)=>{
  if (answered) return;
  const key = e.key.toLowerCase();
  const map = { '1':0,'2':1,'3':2,'4':3,'a':0,'b':1,'c':2,'d':3 };
  if (key in map){
    const idx = map[key];
    const btn = document.getElementById('opt-'+idx);
    if (btn) btn.click();
  }
});

renderQuestion();
</script>
