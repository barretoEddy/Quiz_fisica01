<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin — Quiz Física</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 0%, #111b2d, #080f1a);
      --card-bg: rgba(13, 24, 43, 0.65);
      --card-border: rgba(255, 255, 255, 0.06);
      --card-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      --accent: #2563eb;
      --accent-glow: rgba(37, 99, 235, 0.4);
      --accent-hover: #3b82f6;
      --accent-gradient: linear-gradient(135deg, #3b82f6, #06b6d4);
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.1);
      --success-border: rgba(16, 185, 129, 0.3);
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.1);
      --danger-border: rgba(239, 68, 68, 0.3);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    html, body {
      min-height: 100vh;
      margin: 0;
      font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-primary);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: clamp(1rem, 4vw, 2.5rem);
      box-sizing: border-box;
      overflow-x: hidden;
      position: relative;
    }

    /* Decorative blurred glow circles */
    body::before, body::after {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      filter: blur(120px);
      z-index: -1;
      opacity: 0.12;
      pointer-events: none;
    }
    body::before {
      top: 10%;
      left: 10%;
      background: #3b82f6;
    }
    body::after {
      bottom: 10%;
      right: 10%;
      background: #06b6d4;
    }

    .wrap {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--card-shadow);
      padding: clamp(1.25rem, 4vw, 2.5rem);
      box-sizing: border-box;
      animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    h2 {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: clamp(1.8rem, 4vw, 2.2rem);
      text-align: center;
      background: linear-gradient(to right, #ffffff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0 0 1.5rem 0;
      letter-spacing: -0.02em;
    }

    h3 {
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      font-size: 1.35rem;
      margin: 0 0 1rem 0;
      color: var(--text-primary);
    }

    #status {
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-secondary);
      padding: 0.6rem;
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.02);
      margin-bottom: 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    #auth {
      max-width: 420px;
      margin: 2rem auto;
      background: rgba(255, 255, 255, 0.01);
      border: 1px solid rgba(255, 255, 255, 0.04);
      padding: 2rem;
      border-radius: var(--radius-lg);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    input, textarea, select {
      width: 100%;
      padding: 0.8rem 1rem;
      margin: 0.5rem 0 1rem 0;
      border-radius: var(--radius-md);
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.02);
      color: var(--text-primary);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      box-sizing: border-box;
      transition: var(--transition);
    }

    input:focus, textarea:focus, select:focus {
      outline: none;
      border-color: var(--accent);
      background: rgba(37, 99, 235, 0.04);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    }

    input::placeholder, textarea::placeholder {
      color: var(--text-muted);
    }

    button {
      padding: 0.8rem 1.5rem;
      border-radius: var(--radius-md);
      border: none;
      background: var(--accent-gradient);
      color: #ffffff;
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.5);
    }

    button:active:not(:disabled) {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .row {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 0.5rem;
    }

    .col {
      flex: 1;
      min-width: 140px;
    }

    label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.95rem;
      color: var(--text-secondary);
      cursor: pointer;
      user-select: none;
      height: 100%;
    }

    label input[type="checkbox"] {
      width: auto;
      margin: 0;
      cursor: pointer;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 1.1fr 1.9fr;
      gap: 2rem;
      align-items: start;
    }

    .dashboard-sidebar {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .user-card {
      background: rgba(37, 99, 235, 0.04);
      border: 1px solid rgba(37, 99, 235, 0.15);
      border-radius: var(--radius-md);
      padding: 1.25rem;
    }

    .user-card strong {
      font-family: 'Outfit', sans-serif;
      font-size: 1rem;
      color: #93c5fd;
    }

    #btn-copy-user-id {
      padding: 0.4rem 0.8rem;
      font-size: 0.8rem;
      min-height: auto;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-primary);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: none;
    }

    #btn-copy-user-id:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-1px);
    }

    .form-card {
      background: rgba(255, 255, 255, 0.01);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
    }

    .dashboard-main {
      background: rgba(255, 255, 255, 0.01);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-top: 1rem;
      max-height: 70vh;
      overflow-y: auto;
      padding-right: 6px;
    }

    /* Custom scrollbar for questions list */
    .list::-webkit-scrollbar {
      width: 6px;
    }
    .list::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.01);
      border-radius: 999px;
    }
    .list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
    }
    .list::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .item {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: var(--radius-md);
      padding: 1.25rem;
      transition: var(--transition);
    }

    .item:hover {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.08);
      transform: translateY(-2px);
    }

    .item strong {
      font-family: 'Outfit', sans-serif;
      font-size: 1.1rem;
      color: #93c5fd;
    }

    .item button {
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      font-weight: 600;
      font-family: 'Outfit', sans-serif;
      border-radius: var(--radius-sm);
      min-height: auto;
      box-shadow: none;
    }

    .item button[data-action="edit"] {
      background: rgba(37, 99, 235, 0.1);
      color: #93c5fd;
      border: 1px solid rgba(37, 99, 235, 0.3);
    }

    .item button[data-action="edit"]:hover {
      background: var(--accent);
      color: #ffffff;
      border-color: transparent;
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    .item button[data-action="del"] {
      background: rgba(239, 68, 68, 0.1) !important;
      color: #fca5a5 !important;
      border: 1px solid rgba(239, 68, 68, 0.3) !important;
      margin-left: 6px;
    }

    .item button[data-action="del"]:hover {
      background: var(--danger) !important;
      color: #ffffff !important;
      border-color: transparent !important;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
    }

    .muted {
      color: var(--text-secondary);
      font-size: 0.85rem;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* RESPONSIVENESS MEDIA QUERIES */
    @media (max-width: 900px) {
      body {
        padding: 0.75rem;
      }
      .wrap {
        padding: 1.25rem 1rem;
        border-radius: var(--radius-md);
      }
      .dashboard-grid {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }
      .list {
        max-height: none;
      }
    }

    @media (max-width: 580px) {
      .item > div {
        flex-direction: column !important;
        align-items: flex-start !important;
        gap: 1rem;
      }
      .item div[style*="text-align:right"] {
        text-align: left !important;
        width: 100%;
        display: flex;
        gap: 0.5rem;
        margin-top: 0.5rem;
      }
      .item button {
        flex: 1;
        text-align: center;
      }
      .item button[data-action="del"] {
        margin-left: 0 !important;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>Admin — Quiz de Física</h2>
    <div id="status" class="muted">Carregando...</div>

    <div id="auth">
      <h3>Login</h3>
      <input id="email" placeholder="Seu e-mail de admin">
      <button id="btn-send">Enviar link mágico</button>
      <div class="muted" style="margin-top: 10px;">Faça login com o mesmo e-mail configurado no Supabase.</div>
    </div>

    <div id="panel" style="display:none">
      <div class="dashboard-grid">
        <div class="dashboard-sidebar">
          <div class="user-card">
            <div><strong>Usuário autenticado</strong></div>
            <div class="muted" id="user-email" style="margin-top:4px"></div>
            <div class="muted" style="word-break:break-all;margin-top:4px">ID: <span id="user-id"></span></div>
            <div style="margin-top:10px">
              <button id="btn-copy-user-id" type="button">Copiar user_id</button>
            </div>
          </div>
          
          <div class="form-card">
            <h3>Nova questão</h3>
            <input id="topic" placeholder="Tópico (ex: MRUV)">
            <textarea id="text" rows="3" placeholder="Enunciado"></textarea>
            <textarea id="options" rows="3" placeholder="Uma alternativa por linha"></textarea>
            <input id="correct_index" placeholder="Índice correto (0 = primeira)">
            <input id="explanation" placeholder="Explicação (opcional)">
            <div class="row">
              <div class="col"><input id="sort_order" placeholder="Ordem (num)" type="number"></div>
              <div class="col" style="display: flex; align-items: center;"><label><input id="active" type="checkbox" checked> Ativa</label></div>
            </div>
            <div style="margin-top:14px; display: flex; gap: 10px;">
              <button id="btn-save" style="flex: 1;">Salvar questão</button>
              <button id="btn-clear" style="background:transparent;border:1px solid rgba(255,255,255,0.06);">Limpar</button>
            </div>
          </div>
        </div>

        <div class="dashboard-main">
          <h3>Questões existentes</h3>
          <div id="list" class="list"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const statusEl = document.getElementById('status');
    const authEl = document.getElementById('auth');
    const panelEl = document.getElementById('panel');
    const listEl = document.getElementById('list');
    const userEmailEl = document.getElementById('user-email');
    const userIdEl = document.getElementById('user-id');
    const btnCopyUserId = document.getElementById('btn-copy-user-id');
    const btnSend = document.getElementById('btn-send');
    let magicLinkCooldownUntil = 0;
    let magicLinkCooldownTimer = null;
    const MAGIC_LINK_COOLDOWN_KEY = 'quizFisica.magicLinkCooldownUntil';

    function saveCooldownUntil(value){
      magicLinkCooldownUntil = value;
      try {
        localStorage.setItem(MAGIC_LINK_COOLDOWN_KEY, String(value));
      } catch (error) {
        // ignore storage failures
      }
    }

    function readCooldownUntil(){
      try {
        const storedValue = Number(localStorage.getItem(MAGIC_LINK_COOLDOWN_KEY) || 0);
        return Number.isFinite(storedValue) ? storedValue : 0;
      } catch (error) {
        return 0;
      }
    }

    function stopCooldownTimer(){
      if (magicLinkCooldownTimer) {
        clearInterval(magicLinkCooldownTimer);
        magicLinkCooldownTimer = null;
      }
    }

    function updateMagicLinkButtonState(){
      const now = Date.now();
      const remainingMs = magicLinkCooldownUntil - now;
      if (remainingMs > 0) {
        const remainingSeconds = Math.ceil(remainingMs / 1000);
        btnSend.disabled = true;
        btnSend.textContent = `Aguarde ${remainingSeconds}s`;
        return;
      }
      btnSend.disabled = false;
      btnSend.textContent = 'Enviar link mágico';
      if (magicLinkCooldownUntil > 0) {
        saveCooldownUntil(0);
      }
      stopCooldownTimer();
    }

    function startCooldown(seconds){
      saveCooldownUntil(Date.now() + (seconds * 1000));
      updateMagicLinkButtonState();
      stopCooldownTimer();
      magicLinkCooldownTimer = setInterval(updateMagicLinkButtonState, 1000);
    }

    function hasSupabaseConfig(){
      return window.SUPABASE_URL && window.SUPABASE_ANON_KEY && !window.SUPABASE_URL.includes('your-project-ref');
    }

    if (!hasSupabaseConfig()){
      statusEl.textContent = 'Preencha supabase-config.js com URL e anon key antes de usar o admin.';
      authEl.style.display = 'none';
      throw new Error('Supabase not configured');
    }

    magicLinkCooldownUntil = readCooldownUntil();
    updateMagicLinkButtonState();

    const supabaseClient = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

    function setSignedOutState(){
      authEl.style.display = 'block';
      panelEl.style.display = 'none';
      statusEl.textContent = 'Não autenticado';
      userEmailEl.textContent = '';
      userIdEl.textContent = '';
    }

    function setSignedInState(session){
      authEl.style.display = 'none';
      panelEl.style.display = 'block';
      statusEl.textContent = `Conectado: ${session.user.email}`;
      userEmailEl.textContent = session.user.email || '';
      userIdEl.textContent = session.user.id || '';
    }

    function getEmailRedirectTo(){
      if (window.location.protocol !== 'http:' && window.location.protocol !== 'https:') return '';
      return window.location.href.split('#')[0].split('?')[0];
    }

    async function sendMagicLink(){
      const email = document.getElementById('email').value.trim();
      if (!email) return alert('Informe um e-mail');
      const now = Date.now();
      if (now < magicLinkCooldownUntil) {
        const remainingSeconds = Math.ceil((magicLinkCooldownUntil - now) / 1000);
        statusEl.textContent = `Aguarde ${remainingSeconds}s antes de pedir outro link.`;
        return;
      }
      const redirectTo = getEmailRedirectTo();
      if (!redirectTo){
        statusEl.textContent = 'Para o magic link voltar ao admin, abra esta página via HTTP(S) ou GitHub Pages. Em file:// o Supabase não consegue redirecionar de volta.';
        return;
      }
      btnSend.disabled = true;
      statusEl.textContent = 'Enviando link mágico...';
      const { error } = await supabaseClient.auth.signInWithOtp({
        email,
        options: {
          emailRedirectTo: redirectTo,
        },
      });
      if (error) {
        if (error.status === 429 || error.statusCode === 429 || (error.message && error.message.toLowerCase().includes('rate limit'))) {
          startCooldown(60);
          statusEl.textContent = 'Você pediu muitos links seguidos. Aguarde 60 segundos e tente novamente.';
          return;
        }
        btnSend.disabled = false;
        statusEl.textContent = 'Erro enviando link: ' + error.message;
        return;
      }
      startCooldown(60);
      statusEl.textContent = 'Link enviado. Verifique seu e-mail.';
    }

    btnSend.addEventListener('click', sendMagicLink);

    async function syncAuthState(){
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session && session.user) {
          setSignedInState(session);
          await loadQuestions();
          return;
        }
        setSignedOutState();
      } catch (error) {
        statusEl.textContent = 'Erro de auth: ' + error.message;
        authEl.style.display = 'block';
        panelEl.style.display = 'none';
      }
    }

    supabaseClient.auth.onAuthStateChange((_event, session) => {
      if (session && session.user) {
        setSignedInState(session);
        loadQuestions();
      } else {
        setSignedOutState();
      }
    });

    window.addEventListener('focus', updateMagicLinkButtonState);

    btnCopyUserId.addEventListener('click', async () => {
      const value = userIdEl.textContent.trim();
      if (!value) return alert('Faça login primeiro para obter o user_id.');
      try {
        await navigator.clipboard.writeText(value);
        statusEl.textContent = 'user_id copiado para a área de transferência';
      } catch (error) {
        alert('Não foi possível copiar automaticamente. Copie manualmente o ID exibido.');
      }
    });

    async function loadQuestions(){
      statusEl.textContent = 'Carregando questões...';
      const { data, error } = await supabaseClient.from('questions').select('*').order('sort_order', { ascending: true }).order('id', { ascending: true });
      if (error) { statusEl.textContent = 'Erro carregando: '+error.message; return }
      renderList(data || []);
      statusEl.textContent = 'Pronto';
    }

    function renderList(items){
      listEl.innerHTML = '';
      items.forEach(it => {
        const div = document.createElement('div'); div.className='item';
        div.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center">
          <div><strong>${it.topic}</strong> <span class="muted">#${it.id}</span><div class="muted" style="margin-top: 4px;">${it.text}</div></div>
          <div style="text-align:right">
            <button data-id="${it.id}" data-action="edit">Editar</button>
            <button data-id="${it.id}" data-action="del" style="background:#A32D2D;margin-left:6px">Excluir</button>
          </div>
        </div>`;
        listEl.appendChild(div);
      });
      listEl.querySelectorAll('button').forEach(btn=>btn.addEventListener('click', onListAction));
    }

    async function onListAction(e){
      const id = e.currentTarget.getAttribute('data-id');
      const action = e.currentTarget.getAttribute('data-action');
      if (action === 'del'){
        if (!confirm('Excluir essa questão?')) return;
        const { error } = await supabaseClient.from('questions').delete().eq('id', id);
        if (error) return alert('Erro: '+error.message);
        loadQuestions();
      } else if (action === 'edit'){
        const { data, error } = await supabaseClient.from('questions').select('*').eq('id', id).single();
        if (error) return alert('Erro: '+error.message);
        populateForm(data);
      }
    }

    function populateForm(q){
      document.getElementById('topic').value = q.topic || '';
      document.getElementById('text').value = q.text || '';
      document.getElementById('options').value = (Array.isArray(q.options) ? q.options.join('\n') : (q.options || ''));
      document.getElementById('correct_index').value = q.correct_index ?? q.correct ?? '';
      document.getElementById('explanation').value = q.explanation || '';
      document.getElementById('sort_order').value = q.sort_order ?? '';
      document.getElementById('active').checked = q.active !== false;
      document.getElementById('btn-save').setAttribute('data-edit-id', q.id);
    }

    document.getElementById('btn-clear').addEventListener('click', ()=>{
      document.getElementById('btn-save').removeAttribute('data-edit-id');
      document.getElementById('topic').value='';document.getElementById('text').value='';document.getElementById('options').value='';document.getElementById('correct_index').value='';document.getElementById('explanation').value='';document.getElementById('sort_order').value='';document.getElementById('active').checked=true;
    });

    async function saveQuestion(){
      const editId = document.getElementById('btn-save').getAttribute('data-edit-id');
      const topic = document.getElementById('topic').value.trim();
      const text = document.getElementById('text').value.trim();
      const options = document.getElementById('options').value.split('\n').map(s=>s.trim()).filter(Boolean);
      const correct_index = parseInt(document.getElementById('correct_index').value,10);
      const explanation = document.getElementById('explanation').value.trim();
      const sort_order = parseInt(document.getElementById('sort_order').value,10) || 0;
      const active = !!document.getElementById('active').checked;
      if (!topic || !text || options.length < 2 || !Number.isInteger(correct_index)) return alert('Preencha todos os campos corretamente (opções >=2, índice correto inteiro).');
      const payload = { topic, text, options, correct_index, explanation, active, sort_order };
      if (editId){
        const { error } = await supabaseClient.from('questions').update(payload).eq('id', editId).select();
        if (error) return alert('Erro atualizando: '+error.message);
      } else {
        const { error } = await supabaseClient.from('questions').insert([payload]).select();
        if (error) return alert('Erro inserindo: '+error.message);
      }
      document.getElementById('btn-save').removeAttribute('data-edit-id');
      loadQuestions();
    }

    document.getElementById('btn-save').addEventListener('click', saveQuestion);

    // inicialização
    syncAuthState();
  </script>
</body>
</html>
